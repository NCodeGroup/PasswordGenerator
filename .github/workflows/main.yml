# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: ["published"]

permissions:
  contents: read

env:
  BUILD_CONFIGURATION: Release
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        global-json-file: global.json
        dotnet-version: 6.0.x
    - name: Extract version from tag
      uses: dhkatz/get-version-action@9166b8a614609209809cdef096d62b39287139cb # v3.0.0
      id: extract_version
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration ${BUILD_CONFIGURATION} /p:Version="${BUILD_VERSION}"
      env:
        BUILD_VERSION: ${{ steps.extract_version.outputs.is-semver == 'true' && steps.extract_version.outputs.version-without-v || '0.0.0' }}
    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: binaries
        path: |
          ./*/bin/*
          ./*/obj/*
        if-no-files-found: error
        retention-days: 5

  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 6.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Run rests
        run: dotnet test --no-build --verbosity normal --configuration ${BUILD_CONFIGURATION} --logger trx
      - name: Publish test summary
        if: always()
        shell: pwsh
        run: |
          $results = Get-ChildItem -Path . -Filter '*.trx' -File -Recurse |
            Where-Object { $_.FullName -match '[\\/]TestResults[\\/]' }
          if (-not $results) {
            'No test result files found.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }

          '| Test run | Passed | Failed | Total |' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          '|---|---:|---:|---:|' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          foreach ($result in $results) {
            [xml]$trx = Get-Content -Raw -Path $result.FullName
            $counters = $trx.TestRun.ResultSummary.Counters
            "| $($result.BaseName) | $($counters.passed) | $($counters.failed) | $($counters.total) |" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

  publish:
    if: github.event_name == 'release' && github.event.action == 'published' && github.event.release.tag_name
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
      - name: Upload release artifacts
        run: gh release upload "$TAG_NAME" ./*/bin/${BUILD_CONFIGURATION}/*.nupkg ./*/bin/${BUILD_CONFIGURATION}/*.snupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 6.0.x
      - name: Publish NuGet package
        run: dotnet nuget push ./*/bin/${BUILD_CONFIGURATION}/*.nupkg --api-key "$NUGET_APIKEY" --source https://api.nuget.org/v3/index.json
        env:
          NUGET_APIKEY: ${{ secrets.NUGET_APIKEY }}
