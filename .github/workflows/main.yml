# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: ["published"]

permissions:
  contents: read

env:
  BUILD_CONFIGURATION: Release
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # version.json sets the version (ADR-0138); a release builds and packs it without the -g<commit> suffix.
      PUBLIC_RELEASE: ${{ github.event_name == 'release' }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Nerdbank.GitVersioning computes the version from the history and fails on a shallow clone.
        fetch-depth: 0
        persist-credentials: false
    - name: Setup .NET
      uses: ./.github/actions/install-dotnet
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore --configuration ${BUILD_CONFIGURATION} -p:PublicRelease=${PUBLIC_RELEASE}
    # The library doesn't pack on build (GeneratePackageOnBuild races with dotnet pack, NU5026), so pack what was built.
    - name: Pack
      run: dotnet pack --no-build --configuration ${BUILD_CONFIGURATION} -p:PublicRelease=${PUBLIC_RELEASE}
    # Tests the release check below on every event, so a mistake in it shows before a release needs it.
    - name: Test the release version check
      shell: pwsh
      run: ./build/Test-PackageVersion.SelfTest.ps1
    - name: Check every package has the tag's version
      if: github.event_name == 'release'
      shell: pwsh
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: ./build/Test-PackageVersion.ps1 -Tag $env:TAG -Path "src/*/bin/$env:BUILD_CONFIGURATION/*.nupkg"
    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: binaries
        path: |
          ./src/*/bin/*
          ./src/*/obj/*
          ./tests/*/bin/*
          ./tests/*/obj/*
        if-no-files-found: error
        retention-days: 5

  test:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nerdbank.GitVersioning computes the version from the history and fails on a shallow clone.
          fetch-depth: 0
          persist-credentials: false
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
      - name: Setup .NET
        uses: ./.github/actions/install-dotnet
      - name: Restore dependencies
        run: dotnet restore
      - name: Run rests
        run: dotnet test --no-build --verbosity normal --configuration ${BUILD_CONFIGURATION} --logger trx
      - name: Publish test summary
        if: always()
        shell: pwsh
        run: |
          $results = Get-ChildItem -Path . -Filter '*.trx' -File -Recurse |
            Where-Object { $_.FullName -match '[\\/]TestResults[\\/]' }
          if (-not $results) {
            'No test result files found.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            exit 0
          }

          '| Test run | Passed | Failed | Total |' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          '|---|---:|---:|---:|' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          foreach ($result in $results) {
            [xml]$trx = Get-Content -Raw -Path $result.FullName
            $counters = $trx.TestRun.ResultSummary.Counters
            "| $($result.BaseName) | $($counters.passed) | $($counters.failed) | $($counters.total) |" |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

  publish:
    if: github.event_name == 'release' && github.event.action == 'published' && github.event.release.tag_name
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nerdbank.GitVersioning computes the version from the history and fails on a shallow clone.
          fetch-depth: 0
          persist-credentials: false
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binaries
      - name: Upload release artifacts
        run: gh release upload "$TAG_NAME" ./src/*/bin/${BUILD_CONFIGURATION}/*.nupkg ./src/*/bin/${BUILD_CONFIGURATION}/*.snupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name }}
      - name: Setup .NET
        uses: ./.github/actions/install-dotnet
      - name: Publish NuGet package
        run: dotnet nuget push ./src/*/bin/${BUILD_CONFIGURATION}/*.nupkg --api-key "$NUGET_APIKEY" --source https://api.nuget.org/v3/index.json
        env:
          NUGET_APIKEY: ${{ secrets.NUGET_APIKEY }}
